; PHP-FPM pool configuration
; A pool is a group of PHP processes ready to handle requests
; This file replaces the default www.conf to make PHP-FPM listen on a TCP port
; instead of a Unix socket, which is required for cross-container communication

; Name of the pool — 'www' is the standard name, we only have one pool in Inception
[www]

; Linux user under which PHP-FPM worker processes run
; www-data is the standard low-privilege user for web servers
user = www-data

; Linux group for the PHP-FPM worker processes
; matches the user above — standard practice for web servers
group = www-data

; Address and port PHP-FPM listens on for incoming FastCGI requests
; 0.0.0.0 means accept connections from any IP address
; Required so NGINX (in its own container) can reach PHP-FPM here
; Default was a Unix socket (/run/php/php8.2-fpm.sock) — unusable across containers
listen = 0.0.0.0:9000

; Process manager mode — controls how PHP-FPM manages its worker processes
; dynamic: spawns and kills workers based on current load
; Other options: static (fixed number) or ondemand (spawn only when needed)
; dynamic is the best balance between performance and resource usage
pm = dynamic

; Maximum number of PHP worker processes that can run simultaneously
; Each worker handles one request at a time
; Limit based on available RAM — each PHP process uses roughly 20-50MB
pm.max_children = 5

; Number of worker processes spawned when PHP-FPM starts
; Must be between pm.min_spare_servers and pm.max_spare_servers
pm.start_servers = 2

; Minimum number of idle worker processes kept alive waiting for requests
; If idle workers drop below this, PHP-FPM spawns more
pm.min_spare_servers = 1

; Maximum number of idle worker processes allowed
; If idle workers exceed this, PHP-FPM kills the extras to save memory
pm.max_spare_servers = 3

; Do not clear environment variables before passing them to PHP workers
; Required so WordPress can read variables defined in docker-compose.yml
; (MYSQL_USER, MYSQL_PASSWORD, etc.)
; Default is 'yes' which would hide all those variables from WordPress
clear_env = no
