# Required block for nginx to start — configures how nginx handles connections
# Left empty here: default values are sufficient for Inception
events {}

http {
	# A server block defines one website
	# We only have one in Inception
	server {

		# Listen on port 443 with TLS encryption (HTTPS)
		# Without 'ssl' here, nginx would accept unencrypted connections on 443
		listen 443 ssl;

		# Domain name this server block responds to
		# Must match the local /etc/hosts entry used to reach the VM
		server_name	doley.42.fr;

		# The certificate file nginx presents to the browser during the TLS handshake
		# Generated by openssl in the Dockerfile
		ssl_certificate		/etc/ssl/certs/nginx.crt;

		# The private key paired with the certificate
		# Never leaves the server — proves we are the legitimate certificate owner
		ssl_certificate_key	/etc/ssl/private/nginx.key;

		# Only allow TLS 1.2 and 1.3 — older versions have known security flaws
		# Inception requires this explicitly
		ssl_protocols		TLSv1.2 TLSv1.3;

		# Base folder where WordPress files are stored inside the container
		# When a URL comes in, nginx looks for files starting from this path
		# Example: /wp-login.php → looks for /var/www/wordpress/wp-login.php
		root	/var/www/wordpress;

		# If the URL ends with /, try to serve this file first
		# WordPress uses index.php as its single entry point
		index	index.php;

		# Catch all requests (/ matches everything)
		location / {
			# Try to serve the request in order:
			# 1. $uri	— does this exact file exist on disk? (e.g. logo.png, style.css)
			# 2. $uri/	— does this directory exist on disk? (e.g. /wp-admin/)
			# 3. /index.php?$args — nothing found: hand off to WordPress
			#	WordPress reads the URL, fetches the right content from MariaDB,
			#	and generates the HTML response
			#	$args passes along any URL parameters (e.g. ?s=search or ?page=2)
			try_files $uri $uri/ /index.php?$args;
		}

		# Catch all requests ending in .php
		# ~ means regex match, \.php$ means "ends with .php"
		# This block has priority over location / above
		location ~ \.php$ {

			# Load the standard FastCGI variables nginx provides out of the box
			# Contains ~20 variables PHP-FPM needs: HTTP method, client IP, headers...
			include			fastcgi_params;

			# Tell PHP-FPM which file to execute
			# $document_root		= the value of root above (/var/www/wordpress)
			# $fastcgi_script_name	= the path from the URL (/wp-login.php)
			# Result: /var/www/wordpress/wp-login.php
			# Without this line PHP-FPM receives the request but does not know what to run
			fastcgi_param	SCRIPT_FILENAME $document_root$fastcgi_script_name;

			# Forward the request to the PHP-FPM container via FastCGI protocol
			# 'wordpress' is the service name in docker-compose.yml
			# Docker's internal DNS resolves that name to the container's IP automatically
			# 9000 is the port PHP-FPM listens on inside its container
			fastcgi_pass	wordpress:9000;
		}
	}
}
